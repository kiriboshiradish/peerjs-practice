name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # または master

  # workflow_dispatch から手動で実行することも許可
  workflow_dispatch:

# GITHUB_TOKEN の権限を設定
permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイのコンカレンシー設定
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build
        uses: actions/configure-pages@v4
      - run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.output_url }}
    runs-on: destination
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4